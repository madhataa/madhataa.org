<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Times - Australian Based</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 14px;
        }
        
        .meeting-info {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 40px;
        }
        
        .meeting-time {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .meeting-time label {
            color: #666;
            font-weight: 600;
            font-size: 14px;
        }
        
        .meeting-time-value {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }
        
        .countdown {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .countdown-label {
            color: #666;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        
        .countdown-display {
            display: flex;
            justify-content: center;
            gap: 20px;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .countdown-unit {
            text-align: center;
        }
        
        .countdown-value {
            font-size: 36px;
            font-weight: 700;
            color: #333;
            line-height: 1;
        }
        
        .countdown-label-small {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
            font-weight: 600;
        }
        
        .countdown-separator {
            font-size: 32px;
            color: #ccc;
            font-weight: 300;
        }
        
        #countdown-seconds-unit {
            display: block;
        }
        
        .local-time {
            text-align: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        
        .local-time-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }
        
        .local-time-value {
            font-size: 20px;
            font-weight: 700;
            color: #333;
        }
        
        .local-time-meta {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
        
        .tz-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            list-style: none;
            margin-top: 30px;
        }
        
        .clock-box {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: default;
        }
        
        .clock-box:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }
        
        .clock-box-featured {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea15, #764ba215);
            font-weight: 600;
        }
        
        .clock-emoji {
            font-size: 28px;
            display: block;
            margin-bottom: 8px;
        }
        
        .clock-label {
            font-size: 12px;
            color: #666;
            font-weight: 600;
            margin-bottom: 12px;
        }
        
        .clock-label-text {
            display: block;
        }
        
        .clock-time {
            font-size: 18px;
            font-weight: 700;
            color: #333;
            margin-bottom: 6px;
        }
        
        .clock-meta {
            font-size: 11px;
            color: #999;
        }
        
        .tz {
            display: inline-block;
        }
        
        #on-air-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ef4444;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.3);
            animation: pulse 2s infinite;
        }
        
        #on-air-panel[hidden] {
            display: none;
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 22px;
            }
            
            .countdown-display {
                gap: 10px;
            }
            
            .countdown-value {
                font-size: 28px;
            }
            
            .tz-grid {
                grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 Meeting Times</h1>
        <p class="subtitle">Next meeting in your timezone</p>
        
        <div class="meeting-info">
            <div class="meeting-time">
                <label>Sydney Base Time:</label>
                <div>
                    <div class="meeting-time-value">
                        <span id="sydney-time-value">--:-- --</span>
                        <span id="sydney-time-zone" style="font-size: 12px; color: #999; display: block; margin-top: 4px;"></span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="countdown">
            <div class="countdown-label">Time Until Next Meeting</div>
            <div class="countdown-display">
                <div class="countdown-unit">
                    <div class="countdown-value" id="countdown-hours">00</div>
                    <div class="countdown-label-small">Hours</div>
                </div>
                <div class="countdown-separator">:</div>
                <div class="countdown-unit">
                    <div class="countdown-value" id="countdown-minutes">00</div>
                    <div class="countdown-label-small">Minutes</div>
                </div>
                <div class="countdown-separator" id="countdown-seconds-sep">:</div>
                <div class="countdown-unit" id="countdown-seconds-unit">
                    <div class="countdown-value" id="countdown-seconds">00</div>
                    <div class="countdown-label-small">Seconds</div>
                </div>
            </div>
        </div>
        
        <div class="local-time">
            <div class="local-time-label">Your Local Time for Meeting:</div>
            <div class="local-time-value" id="local-time-value">--:-- --</div>
            <div class="local-time-meta" id="local-time-meta">--</div>
        </div>
        
        <div>
            <div style="font-size: 14px; color: #666; font-weight: 600; margin-bottom: 15px;">Meeting Times by Timezone:</div>
            <ul class="tz-grid" id="start-times"></ul>
        </div>
    </div>
    
    <div id="on-air-panel" hidden>🔴 LIVE NOW</div>

    <script>
        (function(){
        // Master IIFE so we can keep the global scope clean while powering every interactive element on the page.
        // --- Load meeting config from timezones.json ---
        (async function() {
            let cfg;
            try {
                const res = await fetch(`/timezones.json?t=${Date.now()}`, {cache: 'no-store'});
                if (!res.ok) throw new Error('Failed to load timezones.json');
                cfg = await res.json();
            } catch (e) {
                console.error('Unable to load timezones.json', e);
                return;
            }

            // Base meeting time: 7:30 PM Sydney time (Australia/Sydney)
            const meetingCfg = { zone: 'Australia/Sydney', hour: 19, minute: 30 };
            const zones = cfg.zones || [];

            // Utility: compute offset in minutes for a particular instant in a given IANA timeZone.
            function offsetInMinutes(date, timeZone) {
                const dtf = new Intl.DateTimeFormat('en-US', {
                    hour12: false,
                    timeZone,
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
                const parts = dtf.formatToParts(date);
                const data = {};
                parts.forEach(({ type, value }) => { data[type] = value; });
                const asUtc = Date.UTC(
                    Number(data.year),
                    Number(data.month) - 1,
                    Number(data.day),
                    Number(data.hour),
                    Number(data.minute),
                    Number(data.second || 0)
                );
                return (asUtc - date.getTime()) / 60000;
            }

            // Build a Date (UTC instant) that corresponds to the given local Y/M/D H:M in timeZone.
            function zonedLocalToUtc(year, month, day, hour, minute, timeZone) {
                const utcGuess = Date.UTC(year, month - 1, day, hour, minute, 0);
                const offset = offsetInMinutes(new Date(utcGuess), timeZone);
                return new Date(utcGuess - offset * 60000);
            }

            // Build the "next meeting" UTC instant for the meeting zone (Sydney 7:30 PM)
            function nextMeetingInstant(now = new Date()) {
                const localParts = new Intl.DateTimeFormat('en-CA', { timeZone: meetingCfg.zone, year: 'numeric', month: '2-digit', day: '2-digit' }).format(now);
                const [year, month, day] = localParts.split('-').map(Number);

                let candidate = zonedLocalToUtc(year, month, day, meetingCfg.hour, meetingCfg.minute, meetingCfg.zone);

                if (candidate <= now) {
                    const nextDayRef = new Date(now.getTime() + 24 * 60 * 60 * 1000);
                    const localPartsNext = new Intl.DateTimeFormat('en-CA', { timeZone: meetingCfg.zone, year: 'numeric', month: '2-digit', day: '2-digit' }).format(nextDayRef);
                    const [ny, nm, nd] = localPartsNext.split('-').map(Number);
                    candidate = zonedLocalToUtc(ny, nm, nd, meetingCfg.hour, meetingCfg.minute, meetingCfg.zone);
                }
                return candidate;
            }

            const DAY_MS = 24 * 60 * 60 * 1000;
            let countdownTarget = nextMeetingInstant(new Date());

            const container = document.getElementById('start-times');
            const sydneyTimeEl = document.getElementById('sydney-time-value');
            const sydneyZoneEl = document.getElementById('sydney-time-zone');
            const localTimeEls = {
                value: document.getElementById('local-time-value'),
                meta: document.getElementById('local-time-meta')
            };
            const localTimeFormatter = new Intl.DateTimeFormat(undefined, {hour: 'numeric', minute: '2-digit', hour12: true, timeZoneName: 'short'});
            const countdownEls = {
                hours: document.getElementById('countdown-hours'),
                minutes: document.getElementById('countdown-minutes'),
                seconds: document.getElementById('countdown-seconds')
            };
            const countdownSecondsUnit = document.getElementById('countdown-seconds-unit');
            const countdownSecondsSeparator = document.getElementById('countdown-seconds-sep');
            const shouldUseLowEffectsMode = (() => {
                const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                const lowMemory = typeof navigator.deviceMemory === 'number' && navigator.deviceMemory <= 2;
                const saveData = navigator.connection && navigator.connection.saveData;
                return !!(reduceMotion || lowMemory || saveData);
            })();

            if (shouldUseLowEffectsMode) {
                if (countdownSecondsUnit) countdownSecondsUnit.style.display = 'none';
                if (countdownSecondsSeparator) countdownSecondsSeparator.style.display = 'none';
                countdownEls.seconds = null;
            }

            // Build zone grid from cfg.zones
            function renderZoneGrid(utcMeeting) {
                if (!container) return;
                container.innerHTML = '';
                const grid = document.createElement('ul');
                grid.className = 'tz-grid';
                zones.forEach(z => {
                    const parts = new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit', hour12: true, timeZone: z.tz, timeZoneName: 'short' }).formatToParts(utcMeeting);
                    const hour = parts.find(p => p.type === 'hour')?.value || '';
                    const minute = parts.find(p => p.type === 'minute')?.value || '00';
                    const period = parts.find(p => p.type === 'dayPeriod')?.value || '';
                    const tzRaw = parts.find(p => p.type === 'timeZoneName')?.value || '';
                    const tzName = tzRaw;
                    const li = document.createElement('li');
                    li.className = 'clock-box';
                    if (z.featured) li.classList.add('clock-box-featured');
                    li.innerHTML = `
                        <div class="clock-label">${z.emoji ? `<span class="clock-emoji" aria-hidden="true">${z.emoji}</span>` : ''}<span class="clock-label-text">${z.label}</span></div>
                        <div class="clock-time" aria-hidden="true">${hour}:${minute} ${period}</div>
                        <div class="clock-meta"><span class="tz">${tzName}</span></div>
                    `;
                    grid.appendChild(li);
                });
                container.appendChild(grid);
            }

            function updateCountdownAndLocal() {
                const now = new Date();
                if (now > countdownTarget) countdownTarget = nextMeetingInstant(now);

                const totalSeconds = Math.max(0, Math.floor((countdownTarget - now) / 1000));
                const hrs = Math.floor(totalSeconds / 3600);
                const mins = Math.floor((totalSeconds % 3600) / 60);
                const secs = totalSeconds % 60;

                if (countdownEls.hours) countdownEls.hours.textContent = String(hrs).padStart(2, '0');
                if (countdownEls.minutes) countdownEls.minutes.textContent = String(mins).padStart(2, '0');
                if (countdownEls.seconds) countdownEls.seconds.textContent = String(secs).padStart(2, '0');

                if (localTimeEls.value && localTimeEls.meta) {
                    const parts = localTimeFormatter.formatToParts(countdownTarget);
                    const hour = parts.find(p => p.type === 'hour')?.value || '--';
                    const minute = parts.find(p => p.type === 'minute')?.value || '--';
                    const period = parts.find(p => p.type === 'dayPeriod')?.value || '';
                    const tzLabel = parts.find(p => p.type === 'timeZoneName')?.value || Intl.DateTimeFormat().resolvedOptions().timeZone || 'Local';
                    localTimeEls.value.textContent = `${hour}:${minute} ${period}`;
                    localTimeEls.meta.textContent = tzLabel;
                }
            }

            const MEETING_DURATION_MS = 90 * 60 * 1000;

            function updateOnAir() {
                const onAirPanel = document.getElementById('on-air-panel');
                if (!onAirPanel) return;
                const now = new Date();
                const start = countdownTarget;
                const end = new Date(start.getTime() + MEETING_DURATION_MS);
                const isLive = now >= start && now < end;
                if (isLive) onAirPanel.removeAttribute('hidden');
                else onAirPanel.setAttribute('hidden', '');
            }

            // Initialize and render
            if (sydneyTimeEl) {
                const sydneyParts = new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit', hour12: true, timeZone: 'Australia/Sydney' }).formatToParts(countdownTarget);
                const sh = sydneyParts.find(p => p.type === 'hour')?.value || '--';
                const sm = sydneyParts.find(p => p.type === 'minute')?.value || '00';
                const sp = sydneyParts.find(p => p.type === 'dayPeriod')?.value || '';
                sydneyTimeEl.textContent = `${sh}:${sm} ${sp}`;
                if (sydneyZoneEl) {
                    const tzRaw = sydneyParts.find(p => p.type === 'timeZoneName')?.value || '';
                    sydneyZoneEl.textContent = tzRaw;
                }
            }

            renderZoneGrid(countdownTarget);
            updateCountdownAndLocal();
            updateOnAir();
            setInterval(updateCountdownAndLocal, 1000);
            setInterval(updateOnAir, 15000);
        })();
        })();
    </script>
</body>
</html>
