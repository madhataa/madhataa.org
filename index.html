    const meeting = config.meeting || { zone: 'Europe/London', hour: 10, minute: 30, label: 'Daily Reflections Meeting' };

    const nextMeeting = now => { let [year, month, day] = calendarDate(now, meeting.zone); let target = zonedTime(year, month, day, meeting.hour, meeting.minute, meeting.zone); if (target <= now) [...]

    const sydneyIsInDaylightOnLocalDate = instant => {
      const [y, m, d] = calendarDate(instant, 'Australia/Sydney');

    const bigBookInstantForDrInstant = drInstant => {
      const now = new Date();
      // Determine whether Sydney is on daylight saving time on the DR local date
      const isSydneyDaylight = sydneyIsInDaylightOnLocalDate(drInstant);
      let bbStart;
      if (isSydneyDaylight) {

        bbStart = new Date(drInstant.getTime() + bigBook.normal.minutes * 60000);

      return bbStart;

    let bbTarget = bigBookInstantForDrInstant(drTarget);

    // pick the next upcoming meeting (either DR or BB) for the countdown UI

    // Render function: show both meetings' times across the zone grid
    const render = () => {

      const sydneyBB = formatTime(bbTarget, 'Australia/Sydney');
      const englandDR = formatTime(drTarget, meeting.zone);
      const englandBB = formatTime(bbTarget, meeting.zone);

      $('sydney-time-value').textContent = `${value(sydneyDR, 'hour', '--')}:${value(sydneyDR, 'minute', '00')} ${value(sydneyDR, 'dayPeriod')}`;

      $('england-time-value').textContent = `${value(englandDR, 'hour', '--')}:${value(englandDR, 'minute', '00')} ${value(englandDR, 'dayPeriod')}`;
      $('england-time-zone').textContent = `${meeting.label}`;

      const container = $('start-times');
      if (!container) return;
      container.innerHTML = '';

      // Helper to build a grid for a given instant and label
      const buildGrid = (instant, title) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'meeting-grid';
        const heading = document.createElement('h3');
        heading.textContent = title;
        wrapper.appendChild(heading);
        const grid = document.createElement('ul');
        grid.className = 'tz-grid';
        zones.forEach(zone => {
          const time = formatTime(instant, zone.tz), item = document.createElement('li');
          item.className = `clock-box${zone.featured ? ' clock-box-featured' : ''}`;
          item.innerHTML = `<div class="clock-label">${zone.emoji ? `<span class="clock-emoji" aria-hidden="true">${zone.emoji}</span>` : ''}<span class="clock-label-text">${zone.label}</span></d[...]
          grid.appendChild(item);
        });
        wrapper.appendChild(grid);
        return wrapper;
      };

      // Determine labels for grids: Big Book and Daily Reflections
      const titleDR = `${meeting.label} (DR)`;
      const titleBB = `${bigBook.label} (BB)`;

      // Render BB then DR or DR then BB depending on which instant is earlier on that day
      // For visual consistency always show DR first then BB, but include a note when order flips
      const note = document.createElement('p');
      const isSydneyDaylight = sydneyIsInDaylightOnLocalDate(drTarget);
      if (isSydneyDaylight) {
        note.textContent = `Note: While Sydney is on daylight saving time the ${bigBook.label} runs before the ${meeting.label}.`;
      } else {
        note.textContent = '';
      }

      container.appendChild(note);
      container.appendChild(buildGrid(drTarget, meeting.label));
      container.appendChild(buildGrid(bbTarget, bigBook.label));
    };

    render();
    if (lowEffects) { $('countdown-seconds-unit').hidden = true; $('countdown-seconds-sep').hidden = true; }
    const localZone = Intl.DateTimeFormat().resolvedOptions().timeZone;

    const update = () => {
      const now = new Date();
      // Recompute DR target if needed
      if (now >= drTarget || now >= bbTarget) {
        drTarget = nextMeeting(now);
        bbTarget = bigBookInstantForDrInstant(drTarget);
        target = (() => { const now = new Date(); const candidates = [drTarget, bbTarget].filter(t => t && t > now); if (candidates.length === 0) return drTarget; return candidates.reduce((a, b) => a < b ? a : b); })();
        render();
      }

      const remaining = Math.max(0, Math.floor((target - now) / 1000));
      $('countdown-hours').textContent = String(Math.floor(remaining / 3600)).padStart(2, '0');
      $('countdown-minutes').textContent = String(Math.floor(remaining % 3600 / 60)).padStart(2, '0');

      $('on-air-panel').toggleAttribute('hidden', !(drOnAir || bbOnAir));
    };

    update(); setInterval(update, 1000);
  })();

  const decorations = document.querySelector('.decorations'), emojis = ['😀','😃','😄','😁','😆','😅','😂','🤣','😊','😇','🙂','🙃','😉','😌','😋','😛','😜','���[...]
  const addEmoji = direction => { if (!decorations) return; const item = document.createElement('span'); item.className = 'emoji'; item.setAttribute('aria-hidden', 'true'); item.textContent = emo[...]
  if (!lowEffects) { addEmoji('right'); addEmoji('left'); setInterval(() => addEmoji('right'), 2500); setInterval(() => addEmoji('left'), 2500); } else decorations.hidden = true;
  const canvas = $('particles'); if (lowEffects) { canvas.hidden = true; return; } const context = canvas.getContext('2d'); let width, height; const resize = () => { width = canvas.width = innerW[...]
})();
